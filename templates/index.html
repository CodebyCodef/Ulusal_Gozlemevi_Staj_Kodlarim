<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceCalendar AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #fff;
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            height: auto;
        }

        .calendar-section {
            flex: 1;
            min-width: 0;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            height: fit-content;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: rgba(102, 126, 234, 0.5);
        }

        .month-year {
            text-align: center;
            margin-bottom: 15px;
        }

        .month-year h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 8px;
        }

        .weekday {
            text-align: center;
            padding: 8px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 5px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            font-size: 14px;
            min-height: 50px;
            max-height: 70px;
        }

        .day:hover {
            background: rgba(102, 126, 234, 0.3);
        }

        .day.today {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .day.selected {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.4);
        }

        .day.other-month {
            opacity: 0.3;
        }

        .day-events {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
            margin-top: 3px;
            max-height: 35px;
            overflow: hidden;
        }

        .event-dot {
            width: 100%;
            padding: 1px 4px;
            border-radius: 4px;
            font-size: 9px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .event-dot.work { background: #4ade80; color: #000; }
        .event-dot.personal { background: #60a5fa; color: #000; }
        .event-dot.meeting { background: #f472b6; color: #000; }
        .event-dot.other { background: #fbbf24; color: #000; }

        .sidebar {
            width: 420px;
            min-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title svg {
            width: 20px;
            height: 20px;
        }

        .voice-btn {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .voice-btn:hover {
            background: rgba(102, 126, 234, 0.3);
            border-color: #667eea;
        }

        .voice-btn.listening {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border: none;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .voice-btn svg {
            width: 28px;
            height: 28px;
        }

        .voice-transcript {
            margin-top: 12px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            font-size: 13px;
            min-height: 40px;
            color: rgba(255, 255, 255, 0.8);
        }

        .voice-status {
            margin-top: 8px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        .lang-select {
            margin-top: 10px;
        }

        .lang-select select {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 12px;
            cursor: pointer;
        }

        .manual-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 13px;
            outline: none;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.2);
        }

        .form-group select option {
            background: #1a1a2e;
            color: white;
        }

        .submit-btn {
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .ai-assistant-btn {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .ai-assistant-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .ai-assistant-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .ai-assistant-btn svg {
            width: 24px;
            height: 24px;
        }

        .ai-response {
            margin-top: 12px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            max-height: 200px;
            overflow-y: auto;
            line-height: 1.6;
            font-size: 13px;
            white-space: pre-wrap;
        }

        .event-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-info h4 {
            font-size: 14px;
            margin-bottom: 3px;
        }

        .event-info p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        .event-action-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .event-action-btn:hover {
            background: rgba(239, 68, 68, 0.5);
        }

        .event-action-btn svg {
            width: 14px;
            height: 14px;
        }

        .no-events {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            padding: 30px 15px;
        }

        .no-events svg {
            width: 50px;
            height: 50px;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 10px;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: #667eea;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            color: white;
            font-weight: 500;
            font-size: 13px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .toast.success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        @media (max-width: 1200px) {
            .app-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                min-width: unset;
            }
            .calendar-section {
                max-width: 100%;
            }
        }

        @media (max-width: 768px) {
            .app-container {
                padding: 15px;
                gap: 20px;
            }
            .calendar-section {
                padding: 15px;
            }
            .day {
                min-height: 40px;
                font-size: 12px;
            }
            .event-dot {
                font-size: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="calendar-section">
            <div class="calendar-header">
                <h1>VoiceCalendar</h1>
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="changeMonth(-1)">&lt;</button>
                    <button class="nav-btn" onclick="changeMonth(1)">&gt;</button>
                </div>
            </div>
            <div class="month-year">
                <h2 id="currentMonth"></h2>
            </div>
            <div class="weekdays">
                <div class="weekday">Sun</div>
                <div class="weekday">Mon</div>
                <div class="weekday">Tue</div>
                <div class="weekday">Wed</div>
                <div class="weekday">Thu</div>
                <div class="weekday">Fri</div>
                <div class="weekday">Sat</div>
            </div>
            <div class="days-grid" id="daysGrid"></div>
        </div>

        <div class="sidebar">
            <div class="panel">
                <div class="panel-title">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
                    </svg>
                    Voice Input
                </div>
                <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 10v2a7 7 0 01-14 0v-2"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19v4"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 23h8"/>
                    </svg>
                    <span id="voiceBtnText">Tap to Speak</span>
                </button>
                <div class="voice-transcript" id="voiceTranscript">Your voice input will appear here...</div>
                <div class="voice-status" id="voiceStatus"></div>
                <div class="lang-select">
                    <select id="langSelect" onchange="changeLanguage()">
                        <option value="tr-TR">Turkish (Türkçe)</option>
                        <option value="en-US">English</option>
                        <option value="de-DE">German (Deutsch)</option>
                        <option value="fr-FR">French (Français)</option>
                        <option value="es-ES">Spanish (Español)</option>
                    </select>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                    </svg>
                    Add Event Manually
                </div>
                <form class="manual-form" id="manualForm" onsubmit="addManualEvent(event)">
                    <div class="form-group full-width">
                        <label>Event Title</label>
                        <input type="text" id="eventTitle" placeholder="Enter event title..." required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="eventDate" required>
                        </div>
                        <div class="form-group">
                            <label>Time</label>
                            <input type="time" id="eventTime" required>
                        </div>
                    </div>
                    <div class="form-group full-width">
                        <label>Category</label>
                        <select id="eventCategory">
                            <option value="work">Work</option>
                            <option value="personal">Personal</option>
                            <option value="meeting">Meeting</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label>Notes</label>
                        <textarea id="eventNotes" placeholder="Add notes..." rows="2"></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Add Event</button>
                </form>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                    </svg>
                    AI Assistant
                </div>
                <button class="ai-assistant-btn" id="aiBtn" onclick="askAI()">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                    </svg>
                    <span id="aiBtnText">Summarize My Day</span>
                </button>
                <div class="ai-response" id="aiResponse" style="display: none;"></div>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    <span id="selectedDateTitle">Today's Events</span>
                </div>
                <div id="eventsList"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let currentDate = new Date();
        let selectedDate = new Date();
        let events = JSON.parse(localStorage.getItem('calendarEvents') || '[]');
        let isListening = false;
        let recognition = null;

        const months = ['January', 'February', 'March', 'April', 'May', 'June', 
                        'July', 'August', 'September', 'October', 'November', 'December'];

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                document.getElementById('voiceBtn').disabled = true;
                document.getElementById('voiceBtnText').textContent = 'Not Supported';
                document.getElementById('voiceStatus').textContent = 'Browser does not support speech';
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'tr-TR';

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('voiceBtn').classList.add('listening');
                document.getElementById('voiceBtnText').textContent = 'Listening...';
                document.getElementById('voiceStatus').textContent = 'Listening for speech...';
                document.getElementById('voiceTranscript').textContent = 'Listening...';
            };

            recognition.onresult = async (event) => {
                const transcript = Array.from(event.results)
                    .map(result => result[0].transcript)
                    .join('');
                document.getElementById('voiceTranscript').textContent = transcript;

                if (event.results[0].isFinal) {
                    document.getElementById('voiceStatus').textContent = 'Processing...';
                    await processVoiceInput(transcript);
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech error:', event.error);
                isListening = false;
                document.getElementById('voiceBtn').classList.remove('listening');
                document.getElementById('voiceBtnText').textContent = 'Tap to Speak';
                
                let msg = 'Voice error: ';
                if (event.error === 'not-allowed') {
                    msg = 'Microphone denied. Allow mic access in browser settings.';
                } else if (event.error === 'no-speech') {
                    msg = 'No speech detected. Try again.';
                } else if (event.error === 'network') {
                    msg = 'Network error.';
                } else {
                    msg += event.error;
                }
                document.getElementById('voiceStatus').textContent = msg;
                showToast(msg, true);
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('voiceBtn').classList.remove('listening');
                document.getElementById('voiceBtnText').textContent = 'Tap to Speak';
                if (document.getElementById('voiceStatus').textContent === 'Listening for speech...') {
                    document.getElementById('voiceStatus').textContent = 'Ready';
                }
            };

            document.getElementById('voiceStatus').textContent = 'Ready - Click mic to start';
        }

        function changeLanguage() {
            if (recognition) {
                recognition.lang = document.getElementById('langSelect').value;
                showToast('Language: ' + document.getElementById('langSelect').options[document.getElementById('langSelect').selectedIndex].text, false);
            }
        }

        function toggleVoice() {
            if (!recognition) {
                showToast('Speech not supported', true);
                return;
            }

            if (isListening) {
                recognition.stop();
            } else {
                try {
                    recognition.lang = document.getElementById('langSelect').value;
                    recognition.start();
                } catch (e) {
                    recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                    recognition.continuous = false;
                    recognition.interimResults = true;
                    recognition.lang = document.getElementById('langSelect').value;
                    
                    recognition.onstart = () => {
                        isListening = true;
                        document.getElementById('voiceBtn').classList.add('listening');
                        document.getElementById('voiceBtnText').textContent = 'Listening...';
                        document.getElementById('voiceStatus').textContent = 'Listening...';
                    };
                    recognition.onresult = async (event) => {
                        const transcript = Array.from(event.results).map(r => r[0].transcript).join('');
                        document.getElementById('voiceTranscript').textContent = transcript;
                        if (event.results[0].isFinal) {
                            await processVoiceInput(transcript);
                        }
                    };
                    recognition.onerror = (e) => {
                        isListening = false;
                        document.getElementById('voiceBtn').classList.remove('listening');
                        document.getElementById('voiceBtnText').textContent = 'Tap to Speak';
                        showToast('Voice error: ' + e.error, true);
                    };
                    recognition.onend = () => {
                        isListening = false;
                        document.getElementById('voiceBtn').classList.remove('listening');
                        document.getElementById('voiceBtnText').textContent = 'Tap to Speak';
                    };
                    recognition.start();
                }
            }
        }

        async function processVoiceInput(text) {
            if (!text || text.trim().length < 2) {
                showToast('No speech detected', true);
                return;
            }

            document.getElementById('voiceStatus').textContent = 'Sending to AI...';

            try {
                const response = await fetch('/api/process-voice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        text: text,
                        events: events,
                        selectedDate: selectedDate.toISOString().split('T')[0],
                        lang: document.getElementById('langSelect').value
                    })
                });

                const data = await response.json();
                
                if (data.success && data.event) {
                    const event = data.event;
                    event.id = Date.now();
                    events.push(event);
                    saveEvents();
                    renderCalendar();
                    renderEvents();
                    showToast('Added: ' + event.title, false);
                    document.getElementById('voiceTranscript').textContent = 'Added: ' + event.title;
                } else {
                    showToast(data.message || 'Could not add event', true);
                    document.getElementById('voiceTranscript').textContent = 'Failed: ' + (data.message || 'Try again');
                }
                
                document.getElementById('voiceStatus').textContent = 'Ready';
            } catch (error) {
                showToast('Connection error', true);
                document.getElementById('voiceStatus').textContent = 'Error - Try again';
            }
        }

        function addManualEvent(e) {
            e.preventDefault();
            
            const title = document.getElementById('eventTitle').value.trim();
            const date = document.getElementById('eventDate').value;
            const time = document.getElementById('eventTime').value;
            const category = document.getElementById('eventCategory').value;
            const notes = document.getElementById('eventNotes').value.trim();

            if (!title || !date || !time) {
                showToast('Fill all fields', true);
                return;
            }

            const event = {
                id: Date.now(),
                title,
                date,
                time,
                category,
                notes: notes || ''
            };

            events.push(event);
            saveEvents();
            renderCalendar();
            renderEvents();

            document.getElementById('manualForm').reset();
            setTodayDate();
            showToast('Event added: ' + title, false);
        }

        function setTodayDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('eventDate').value = today;
        }

        async function askAI() {
            const aiBtn = document.getElementById('aiBtn');
            const aiBtnText = document.getElementById('aiBtnText');
            const aiResponse = document.getElementById('aiResponse');

            aiBtn.disabled = true;
            aiBtnText.textContent = 'Analyzing...';
            aiResponse.style.display = 'block';
            aiResponse.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

            try {
                const response = await fetch('/api/ai-summary', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        events: events,
                        date: selectedDate.toISOString().split('T')[0]
                    })
                });

                const data = await response.json();
                aiResponse.textContent = data.response || 'No events for this day.';
            } catch (error) {
                aiResponse.textContent = 'Error getting AI response.';
            }

            aiBtn.disabled = false;
            aiBtnText.textContent = 'Summarize My Day';
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('currentMonth').textContent = months[month] + ' ' + year;

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDay = firstDay.getDay();
            const daysInMonth = lastDay.getDate();

            const today = new Date();
            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';

            const prevMonth = new Date(year, month, 0);
            const prevMonthDays = prevMonth.getDate();

            for (let i = startDay - 1; i >= 0; i--) {
                const day = document.createElement('div');
                day.className = 'day other-month';
                day.innerHTML = `<span>${prevMonthDays - i}</span>`;
                grid.appendChild(day);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                const dayEvents = events.filter(e => e.date === dateStr);
                const isToday = today.getDate() === day && today.getMonth() === month && today.getFullYear() === year;
                const isSelected = selectedDate.getDate() === day && selectedDate.getMonth() === month && selectedDate.getFullYear() === year;

                const dayEl = document.createElement('div');
                dayEl.className = 'day' + (isToday ? ' today' : '') + (isSelected ? ' selected' : '');
                dayEl.innerHTML = `<span>${day}</span>`;

                if (dayEvents.length > 0) {
                    const eventsDiv = document.createElement('div');
                    eventsDiv.className = 'day-events';
                    dayEvents.slice(0, 2).forEach(evt => {
                        const dot = document.createElement('div');
                        dot.className = 'event-dot ' + evt.category;
                        dot.textContent = evt.title;
                        eventsDiv.appendChild(dot);
                    });
                    if (dayEvents.length > 2) {
                        const more = document.createElement('div');
                        more.className = 'event-dot other';
                        more.textContent = '+' + (dayEvents.length - 2);
                        eventsDiv.appendChild(more);
                    }
                    dayEl.appendChild(eventsDiv);
                }

                dayEl.onclick = () => selectDate(year, month, day);
                grid.appendChild(dayEl);
            }

            const totalCells = startDay + daysInMonth;
            const remaining = 42 - totalCells;
            for (let i = 1; i <= remaining; i++) {
                const day = document.createElement('div');
                day.className = 'day other-month';
                day.innerHTML = `<span>${i}</span>`;
                grid.appendChild(day);
            }
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function selectDate(year, month, day) {
            selectedDate = new Date(year, month, day);
            document.getElementById('selectedDateTitle').textContent = formatDate(selectedDate);
            renderCalendar();
            renderEvents();
        }

        function formatDate(date) {
            return date.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
        }

        function renderEvents() {
            const dateStr = selectedDate.getFullYear() + '-' + String(selectedDate.getMonth() + 1).padStart(2, '0') + '-' + String(selectedDate.getDate()).padStart(2, '0');
            const dayEvents = events.filter(e => e.date === dateStr);
            const list = document.getElementById('eventsList');

            if (dayEvents.length === 0) {
                list.innerHTML = `
                    <div class="no-events">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                        <p>No events</p>
                        <p style="font-size: 11px; margin-top: 5px;">Add via form or voice</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = dayEvents.map((event, index) => {
                const sameDayEvents = dayEvents;
                const realIndex = events.indexOf(event);
                return `
                <div class="event-item">
                    <div class="event-info">
                        <h4>${event.title}</h4>
                        <p>${event.time} - ${event.category}${event.notes ? ' - ' + event.notes : ''}</p>
                    </div>
                    <button class="event-action-btn" onclick="deleteEvent(${realIndex})">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                    </button>
                </div>
                `;
            }).join('');
        }

        function deleteEvent(index) {
            events.splice(index, 1);
            saveEvents();
            renderCalendar();
            renderEvents();
            showToast('Event deleted', false);
        }

        function saveEvents() {
            localStorage.setItem('calendarEvents', JSON.stringify(events));
        }

        function showToast(message, isError) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : ' success');
            setTimeout(() => toast.className = 'toast', 3000);
        }

        initSpeechRecognition();
        setTodayDate();
        renderCalendar();
        renderEvents();
    </script>
</body>
</html>
